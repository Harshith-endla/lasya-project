services:
  - type: web
    name: recruitment-management-platform
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm --prefix client run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
